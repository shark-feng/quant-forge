[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqs"
version = "0.1.0"
description = "A-share quantitative research system (research & education only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary-Research" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
science = ["scipy>=1.10", "statsmodels>=0.14", "cvxpy>=1.4"]
io = ["pyarrow>=14.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
